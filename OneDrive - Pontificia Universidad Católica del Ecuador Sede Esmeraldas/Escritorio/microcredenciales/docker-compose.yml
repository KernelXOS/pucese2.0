# ===========================================================================
# Microcredenciales IA - PUCE Sede Esmeraldas
# Stack Blockcerts (MIT) sobre Testnet Sepolia. Costo de red: $0.
#
# Diseño de aislamiento (tu VPS ya corre moodle/ojs/omp):
#   - Red dedicada "microcred_net" (no toca las redes existentes).
#   - Prefijo de proyecto via COMPOSE_PROJECT_NAME en .env.
#   - cert-tools y cert-issuer son CLIs "one-shot": NO se levantan con
#     `docker compose up`. Viven bajo el profile "tools" y se ejecutan con
#     `docker compose run --rm <servicio> <comando>`.
#   - El único servicio persistente es "verifier" (nginx) en un puerto alto.
# ===========================================================================
name: microcredenciales

networks:
  microcred_net:
    name: microcred_net
    driver: bridge

services:

  # --- Generador de plantillas y lotes de certificados (sin firmar) --------
  cert-tools:
    build:
      context: ./cert-tools
      args:
        CERT_TOOLS_REF: ${CERT_TOOLS_REF:-master}
    image: microcred/cert-tools:local
    container_name: microcred_cert_tools
    profiles: ["tools"]            # no arranca con `up`, solo con `run`
    working_dir: /data/cert-tools
    volumes:
      - ./data:/data
    networks:
      - microcred_net

  # --- Firmador / anclador en blockchain (Sepolia) ------------------------
  cert-issuer:
    build:
      context: ./cert-issuer
      args:
        CERT_ISSUER_REF: ${CERT_ISSUER_REF:-v3.13.1}
    image: microcred/cert-issuer:local
    container_name: microcred_cert_issuer
    profiles: ["tools"]
    working_dir: /opt/cert-issuer
    volumes:
      - ./data:/data
    networks:
      - microcred_net

  # --- Verificador web (componente blockcerts-verifier servido por nginx) --
  verifier:
    image: nginx:1.27-alpine
    container_name: microcred_verifier
    restart: unless-stopped
    ports:
      - "${VERIFIER_PORT:-8089}:80"
      - "${VERIFIER_HTTPS_PORT:-8443}:443"
    volumes:
      - ./verifier:/usr/share/nginx/html:ro
      # Expone los certificados YA firmados para que el verificador los lea por URL:
      - ./data/cert-issuer/blockchain_certificates:/usr/share/nginx/html/certs:ro
      # Config con server block TLS (8443) + cert autofirmado:
      - ./verifier/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./verifier/tls:/etc/nginx/tls:ro
    networks:
      - microcred_net
