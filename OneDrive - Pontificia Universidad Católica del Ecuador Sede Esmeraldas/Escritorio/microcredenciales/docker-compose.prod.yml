# ===========================================================================
# DESPLIEGUE EN EL VPS  —  SOLO el verificador (nginx estatico).
#
# Diseño seguro y aislado:
#   - NO incluye cert-tools / cert-issuer / clave privada (eso se queda en tu
#     maquina de emision). Aqui solo se sirven archivos PUBLICOS.
#   - Red Docker dedicada + nombre de proyecto propio -> no toca moodle/ojs/omp.
#   - Escucha SOLO en 127.0.0.1 -> no abre puertos publicos. Tu Apache hace de
#     reverse proxy y pone el HTTPS real (Let's Encrypt).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
# ===========================================================================
name: microcred-verifier

networks:
  microcred_net:
    name: microcred_net
    driver: bridge

services:
  verifier:
    image: nginx:1.27-alpine
    container_name: microcred_verifier
    restart: unless-stopped
    ports:
      # host(solo localhost):contenedor  -> Apache proxya a este puerto.
      - "127.0.0.1:${VERIFIER_PORT:-8089}:80"
    volumes:
      - ./verifier:/usr/share/nginx/html:ro
    networks:
      - microcred_net
