# =====================================================================
# Apache VirtualHost para el verificador de microcredenciales.
# Dominio: credenciales.pucese.kernelxos.com  ->  contenedor en 127.0.0.1:8089
#
# Instalacion (en el VPS):
#   sudo a2enmod proxy proxy_http headers
#   sudo cp credenciales.pucese.kernelxos.com.conf /etc/apache2/sites-available/
#   sudo a2ensite credenciales.pucese.kernelxos.com
#   sudo systemctl reload apache2
#   sudo certbot --apache -d credenciales.pucese.kernelxos.com
# =====================================================================
<VirtualHost *:80>
    ServerName credenciales.pucese.kernelxos.com

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8089/
    ProxyPassReverse /  http://127.0.0.1:8089/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/credenciales_error.log
    CustomLog ${APACHE_LOG_DIR}/credenciales_access.log combined
</VirtualHost>
