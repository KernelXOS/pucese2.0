; ===========================================================================
; cert-tools conf.ini  (Blockcerts v2 / Open Badges v2)
; Emisor: PUCE Sede Esmeraldas
; ---------------------------------------------------------------------------
; OJO: las rutas son RELATIVAS a data_dir. data_dir es absoluto dentro del
; contenedor (montamos ./data -> /data en docker-compose).
; ===========================================================================

; --- Datos del emisor (Issuer) ---------------------------------------------
issuer_name = PUCE Sede Esmeraldas
issuer_url  = https://www.pucese.edu.ec
issuer_email = ricardo.guanolisa@pucese.edu.ec

; URL PÚBLICA donde alojarás el perfil del emisor (issuer.json).
; DEBE ser accesible por HTTP para que el verificador valide.
; LOCAL (demo): lo sirve el propio nginx del verificador.
; PRODUCCIÓN: cambia a https://www.pucese.edu.ec/blockcerts/issuer.json
issuer_id = https://credenciales.pucese.kernelxos.com/issuer.json

; Lista de revocación (servida junto al issuer.json).
revocation_list = https://credenciales.pucese.kernelxos.com/revocation.json

; Clave pública del emisor = dirección de la wallet emisora en Sepolia.
; Debe coincidir con `issuing_address` del cert-issuer y figurar en issuer.json.
issuer_public_key = 0x2f7322f882c0004df7fEC72f64416e534bEAd06C

issuer_logo_file = images/logo.png

; --- Datos de la credencial (Badge) ----------------------------------------
certificate_title = Fundamentos de Prompt Engineering y LLMs
certificate_description = Microcredencial que certifica el dominio de fundamentos de Prompt Engineering y modelos de lenguaje de gran escala (LLMs): diseno de prompts, tecnicas de few-shot y chain-of-thought, evaluacion de salidas y consideraciones eticas de la IA generativa.
criteria_narrative = El participante completo el itinerario formativo, aprobo la evaluacion practica de diseno y refinamiento de prompts, y demostro competencia en el uso responsable de LLMs.
cert_image_file = images/certificate-image.png

; UUID estable de la insignia (genera el tuyo con: python -c "import uuid;print(uuid.uuid4())")
badge_id = 7f3b2c10-1a2b-4c3d-8e9f-000000000001

; --- Configuracion del lote -------------------------------------------------
data_dir = /data/cert-tools
template_dir = certificate_templates
template_file_name = microcredencial_ia.json
unsigned_certificates_dir = unsigned_certificates
roster = rosters/roster.csv

filename_format = uuid
no_clobber = True
hash_emails = False

; --- Campos extra globales --------------------------------------------------
; El esquema Blockcerts V3 EXIGE un `nonce` (anti-replay) que cert-tools NO
; agrega solo. Lo inyectamos en la plantilla via additional_global_fields.
; Tras editar esto hay que RE-generar la plantilla (create-certificate-template).
additional_global_fields = {"fields": [{"path": "$.credentialSubject", "value": {"id": "recipient-placeholder"}}, {"path": "$.nonce", "value": "puce-esm-2026-ia-prompt-eng-batch01"}, {"path": "$.display", "value": {"contentMediaType": "text/html", "content": "<section style='font-family:system-ui;max-width:680px'><h1 style='color:#003366'>Fundamentos de Prompt Engineering y LLMs</h1><p><strong>PUCE Sede Esmeraldas</strong> certifica que la persona identificada completo y aprobo esta microcredencial en competencias de Inteligencia Artificial.</p><p>Contenido: diseno y refinamiento de prompts, tecnicas few-shot y chain-of-thought, evaluacion de salidas de LLMs y uso etico de la IA generativa.</p></section>"}}]}
