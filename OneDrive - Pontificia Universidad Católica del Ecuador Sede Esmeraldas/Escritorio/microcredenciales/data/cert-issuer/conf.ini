; ===========================================================================
; cert-issuer conf.ini  ->  Anclaje en Ethereum SEPOLIA (testnet, costo $0)
; Rutas absolutas dentro del contenedor (montamos ./data -> /data).
; ===========================================================================

; --- Identidad del emisor en cadena ----------------------------------------
; Direccion de la wallet emisora (la misma que pusiste en issuer_public_key
; del cert-tools y en issuer.json). Debe tener SepoliaETH de un faucet.
issuing_address = 0x2f7322f882c0004df7fEC72f64416e534bEAd06C

; --- Cadena objetivo --------------------------------------------------------
chain = ethereum_sepolia

; Nodo RPC de Sepolia. Publico y gratis (sin API key):
sepolia_rpc_url = https://ethereum-sepolia-rpc.publicnode.com
; Alternativas: https://rpc.sepolia.org
;               https://eth-sepolia.g.alchemy.com/v2/TU_API_KEY  (free tier)
;               https://sepolia.infura.io/v3/TU_API_KEY          (free tier)

; --- Clave privada del emisor ----------------------------------------------
; usb_name = carpeta que contiene el key_file. key_file es relativo a usb_name.
; El archivo debe contener SOLO la clave privada hex con prefijo 0x.
usb_name = /data/cert-issuer/
key_file = pk_issuer.txt

; --- Rutas de entrada/salida ------------------------------------------------
; Entrada = salida de cert-tools (carpeta compartida).
unsigned_certificates_dir = /data/cert-tools/unsigned_certificates
blockchain_certificates_dir = /data/cert-issuer/blockchain_certificates
work_dir = /data/cert-issuer/work

; --- Gas (EIP-1559) ---------------------------------------------------------
; gas_limit por defecto (25000) es insuficiente para anclar datos. Subelo.
gas_limit = 250000
; max_fee_per_gas en wei (2 gwei). En Sepolia es de sobra.
gas_price = 2000000000
max_priority_fee_per_gas = 1500000000
; Si prefieres que el gas se calcule solo desde Etherscan, descomenta ambas:
; gas_price_dynamic = True
; etherscan_api_token = TU_ETHERSCAN_API_KEY

; --- Flags ------------------------------------------------------------------
; Permite ejecutar en una maquina con conexion a internet (testnet, ok).
no_safe_mode = True
